services:
  - type: web
    name: central-ofertas-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build -w shared && npm run build -w backend
    startCommand: npm run start -w backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: central-ofertas-db
          property: connectionString
  - type: static
    name: central-ofertas-web
    rootDir: .
    buildCommand: npm ci && npm run build -w shared && npm run build -w frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: central-ofertas-db
    databaseName: central_ofertas
